name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt flake8 pytest

      - name: Lint with flake8
        run: flake8 app/app.py --max-line-length=100

      - name: Run tests
        run: cd app && pytest tests/ -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-demo-app ./app

      - name: Smoke test container
        run: |
          docker run -d -p 5000:5000 --name app devops-demo-app
          sleep 3
          curl -f http://localhost:5000/health
          docker stop app
